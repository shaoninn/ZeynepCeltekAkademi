services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: zcaroot
      MYSQL_DATABASE: zeynepceltekakademi
      MYSQL_USER: zca
      MYSQL_PASSWORD: zca
    ports:
      - "3306:3306"
    volumes:
      - zca_mysql_data:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

volumes:
  zca_mysql_data:
